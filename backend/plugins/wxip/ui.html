<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>动态企微可信IP · PanShare</title>
<style>
  :root{
    --bg:#f5f6f8; --panel:#fff; --panel-soft:#fafbfc;
    --line:#e6e8ec; --line-strong:#d5d9e0;
    --text:#1f2329; --text-2:#5b6470; --muted:#8b929c;
    --brand:#2f6feb; --brand-soft:#eaf1ff; --brand-line:#c9dcff;
    --ok:#16794a; --ok-soft:#e8f6ee;
    --warn:#9a6600; --warn-soft:#fff6e5;
    --err:#c0362c; --err-soft:#fdeceb;
    --radius:12px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:14px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",
      "Hiragino Sans GB","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
  h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}
  p{margin:0}
  .wrap{max-width:1120px;margin:0 auto;padding:22px 24px 56px}

  .page-head{display:flex;gap:18px;align-items:flex-start;margin-bottom:18px}
  .page-head .text{flex:1;min-width:0}
  .page-head h1{font-size:19px;margin-bottom:8px}
  .page-head .desc{color:var(--text-2);font-size:12.5px;line-height:1.85}
  .head-actions{display:flex;gap:8px;flex:0 0 auto;flex-wrap:wrap}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
    height:32px;padding:0 13px;border-radius:8px;border:1px solid var(--line-strong);
    background:#fff;color:var(--text);font:inherit;font-size:13px;cursor:pointer;
    white-space:nowrap;transition:background .15s,border-color .15s}
  .btn:hover{border-color:#c3c9d2;background:#fcfcfd}
  .btn:disabled{opacity:.55;cursor:not-allowed}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn.primary:hover{background:#2a63d4}
  .btn.danger{color:var(--err);border-color:#f0c8c4}
  .btn.sm{height:28px;padding:0 10px;font-size:12px;border-radius:7px}

  .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:16px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px 18px;display:flex;align-items:center;gap:14px;min-width:0}
  .stat .ico{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;
    justify-content:center;font-size:18px;flex:0 0 40px}
  .stat .ico.blue{background:#eef4ff;color:#3b74e8}
  .stat .ico.green{background:#eaf7ef;color:#2f9e5f}
  .stat .ico.amber{background:#fff5e6;color:#d18900}
  .stat .ico.violet{background:#f1edff;color:#6b4fd8}
  .stat .label{font-size:12.5px;color:var(--muted)}
  .stat .value{font-size:17px;font-weight:600;line-height:1.35;overflow-wrap:anywhere}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:18px 20px;margin-bottom:16px}
  .card-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .card-head h2{font-size:14.5px}
  .card-head .note{color:var(--muted);font-size:12px}
  .card-head .sp{flex:1}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
  label.field{display:block;margin-bottom:13px;min-width:0}
  label.field > span{display:block;font-size:12.5px;color:var(--text-2);margin-bottom:5px}
  .hint{color:var(--muted);font-size:11.5px;line-height:1.6;margin-top:5px}
  .switch-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
  .switch-row:last-child{border-bottom:0}
  .switch-row .txt{flex:1;min-width:0}
  .switch-row .txt .t{font-size:13px}
  .switch-row .txt .d{color:var(--muted);font-size:12px;margin-top:2px}
  .switch{position:relative;width:44px;height:24px;flex:0 0 44px}
  .switch input{position:absolute;inset:0;opacity:0;z-index:2;cursor:pointer;margin:0}
  .switch .track{position:absolute;inset:0;border-radius:999px;background:#d5d9e0;transition:background .18s}
  .switch .track::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;
    border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(16,24,40,.25);transition:transform .18s}
  .switch input:checked ~ .track{background:var(--brand)}
  .switch input:checked ~ .track::after{transform:translateX(20px)}
  input,textarea{width:100%;border:1px solid var(--line-strong);border-radius:8px;
    padding:8px 10px;font:inherit;font-size:13px;background:#fff;color:var(--text)}
  input:focus,textarea:focus{outline:2px solid var(--brand-soft);border-color:var(--brand)}
  .mono{font-family:"SFMono-Regular",ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
  .badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:1px 8px;
    border-radius:999px;background:#f1f3f6;color:var(--text-2);white-space:nowrap}
  .badge.ok{background:var(--ok-soft);color:var(--ok)}
  .badge.warn{background:var(--warn-soft);color:var(--warn)}
  .badge.err{background:var(--err-soft);color:var(--err)}
  .badge.brand{background:var(--brand-soft);color:var(--brand)}

  .qr-box{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
  .qr-box img{width:180px;height:180px;border:1px solid var(--line);border-radius:10px;background:#fff}
  .qr-box .tip{color:var(--text-2);font-size:12.5px;line-height:1.8;max-width:420px}
  .verify-box{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
  .verify-box .vimg{max-width:300px;max-height:180px;border:1px solid var(--line);border-radius:10px;background:#fff;object-fit:contain}
  .verify-box .vform{flex:1;min-width:240px}
  .verify-box .vmsg{color:var(--warn);font-size:12.5px;line-height:1.7;margin-bottom:10px}
  .verify-box .vrow{display:flex;gap:8px;align-items:center}
  .verify-box .vrow input{flex:1;min-width:0}
  @media (max-width:560px){
    .verify-box .vimg{max-width:100%;max-height:150px}
    .verify-box .vform{min-width:100%}
  }
  .events{display:flex;flex-direction:column}
  .ev{display:flex;align-items:center;gap:10px;padding:8px 2px;border-top:1px solid #f1f3f6;font-size:12.5px}
  .ev:first-child{border-top:0}
  .ev .txt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-2)}
  .ev .tm{color:var(--muted);font-size:11.5px;flex:0 0 auto;font-variant-numeric:tabular-nums}
  .shot{max-width:100%;border:1px solid var(--line);border-radius:10px;margin-top:10px;display:none}
  .notice{background:var(--brand-soft);border:1px solid var(--brand-line);color:#1e4fa8;
    border-radius:10px;padding:12px 14px;font-size:12.5px;line-height:1.7;margin-bottom:16px}
  .bbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-radius:10px;
    padding:10px 14px;font-size:12.5px;line-height:1.6;margin-bottom:16px}
  .bbar.busy{background:#fff8e6;border:1px solid #f5dfa0;color:#8a6100}
  .bbar.err{background:var(--err-soft);border:1px solid #f0c8c4;color:var(--err)}
  .bbar .dot{width:8px;height:8px;flex:0 0 8px;border-radius:50%;background:currentColor;
    animation:bbarpulse 1.2s ease-in-out infinite}
  .bbar .txt{flex:1;min-width:180px}
  @keyframes bbarpulse{0%,100%{opacity:.35}50%{opacity:1}}
  .empty{color:var(--muted);font-size:13px;padding:14px 2px}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#1f2329;
    color:#fff;padding:9px 16px;border-radius:9px;font-size:13px;opacity:0;transition:.2s;
    z-index:60;max-width:80vw;pointer-events:none}
  .toast.show{opacity:.95}

  @media (max-width:900px){
    .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
    .page-head{flex-direction:column}
    .head-actions{width:100%}
    .grid2{grid-template-columns:1fr}
  }
  @media (max-width:560px){
    .wrap{padding:16px 14px 44px}
    .stats{gap:10px}
    .stat{flex-direction:column;align-items:flex-start;gap:7px;padding:12px}
    .stat .ico{width:30px;height:30px;flex:0 0 30px;font-size:15px;border-radius:9px}
    .stat .label{font-size:12px}
    .stat .value{font-size:15px}
    .page-head h1{font-size:17px}
    .page-head .desc{font-size:12px;line-height:1.78}
    .card{padding:15px 14px}
    .qr-box img{width:150px;height:150px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="page-head">
    <div class="text">
      <h1>动态企微可信IP</h1>
      <p class="desc">
        家里宽带出口 IP 一变，企微自建应用就会因为「企业可信IP」不匹配而发不出消息、收不到回调。
        这个插件扫码登录企微管理后台，定时比对公网 IP，变了就自动进应用详情把新 IP 追加进可信列表。<br>
        支持 6 路 IP 探测容灾、AgentId 自动发现、手动强制更新、变更通知与诊断截图。
      </p>
    </div>
    <div class="head-actions">
      <button class="btn" onclick="load()">↻ 刷新</button>
      <button class="btn primary" onclick="act('login')">扫码登录</button>
      <button class="btn" onclick="act('update')">立即更新</button>
    </div>
  </header>

  <div id="hint"></div>

  <div class="stats" id="stats"></div>

  <div id="browserBar"></div>

  <section class="card" id="loginCard">
    <div class="card-head"><h2>企微后台登录</h2><span class="sp"></span><span id="loginTag" class="badge">—</span></div>
    <div id="loginBody"></div>
    <div class="card-head" style="margin-top:12px;margin-bottom:0">
      <button class="btn sm" onclick="act('shot')">诊断截图</button>
      <button class="btn sm danger" onclick="act('logout')">退出登录</button>
    </div>
    <img id="shotImg" class="shot" alt="诊断截图">
  </section>

  <section class="card">
    <div class="card-head"><h2>设置</h2><span class="sp"></span>
      <button class="btn primary sm" onclick="save()">保存设置</button></div>
    <div class="switch-row">
      <div class="txt"><div class="t">启用定时检测</div><div class="d">关掉后只有手动点「立即更新」才会动作</div></div>
      <label class="switch"><input type="checkbox" id="f_enabled"><span class="track"></span></label>
    </div>
    <div class="switch-row">
      <div class="txt"><div class="t">IP 变了自动写入</div><div class="d">关掉后只提醒，不自动改企微后台</div></div>
      <label class="switch"><input type="checkbox" id="f_auto"><span class="track"></span></label>
    </div>
    <div class="switch-row">
      <div class="txt"><div class="t">变更时发通知</div><div class="d">通过主服务的通知渠道推送结果</div></div>
      <label class="switch"><input type="checkbox" id="f_notify"><span class="track"></span></label>
    </div>
    <div class="grid2" style="margin-top:14px">
      <label class="field"><span>检测间隔（秒，最小 60）</span>
        <input id="f_interval" type="number" min="60" step="30" placeholder="300"></label>
      <label class="field"><span>AgentId（逗号分隔，留空自动发现）</span>
        <input id="f_agents" placeholder="1234567,7654321"></label>
      <label class="field"><span>访问企微后台的代理（可选）</span>
        <input id="f_proxy" placeholder="http://127.0.0.1:7890"></label>
    </div>
  </section>

  <section class="card">
    <div class="card-head"><h2>更新记录</h2><span class="note">最近 20 条</span></div>
    <div id="history" class="events"></div>
  </section>
</div>
<div id="toast" class="toast"></div>

<script>
const API = 'api';
let state = null, busy = false, formTouched = false;

async function req(path, opts={}){
  const res = await fetch(API + path, Object.assign({headers:{'Content-Type':'application/json'}}, opts));
  const data = await res.json().catch(()=>({}));
  if(!res.ok || data.detail && data.ok === false) throw new Error(data.detail || ('HTTP ' + res.status));
  return data;
}
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g,
  c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg, bad){
  const el = document.getElementById('toast');
  el.textContent = msg; el.style.background = bad ? '#c0362c' : '#1f2329';
  el.classList.add('show'); clearTimeout(el._t);
  el._t = setTimeout(()=>el.classList.remove('show'), 3200);
}
function fmtTime(sec){
  if(!sec) return '—';
  const d = new Date(Number(sec)*1000), p = n => String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
}
function ago(sec){
  if(!sec) return '从未';
  const s = Date.now()/1000 - Number(sec);
  if(s < 60) return '刚刚';
  if(s < 3600) return Math.floor(s/60)+' 分钟前';
  if(s < 86400) return Math.floor(s/3600)+' 小时前';
  return Math.floor(s/86400)+' 天前';
}
const loginLabel = {idle:'未登录', qr:'二维码已生成', waiting:'等待扫码', verify:'需要验证码', ok:'已登录', expired:'登录已过期', error:'登录失败'};

function render(){
  if(!state) return;
  const s = state.settings || {}, last = state.last_update || {};
  document.getElementById('hint').innerHTML = state.hint
    ? '<div class="notice">⚠ '+esc(state.hint)+'</div>' : '';

  // 浏览器准备状态条：下载中提示稍候，失败给重试按钮
  const bbar = document.getElementById('browserBar');
  const bs = state.browser;
  if(bs === 'installing' || bs === 'failed' || bs === 'unsupported'){
    const cls = bs === 'installing' ? 'busy' : 'err';
    const dot = bs === 'installing' ? '<span class="dot"></span>' : '';
    const retry = (bs === 'failed' || bs === 'unsupported')
      ? ' <button class="btn sm" onclick="act(\'browser\')">重试下载</button>' : '';
    bbar.innerHTML = '<div class="bbar '+cls+'">'+dot+
      '<span class="txt">'+esc(state.browser_msg || (bs==='installing'?'正在下载浏览器…':'浏览器不可用'))+'</span>'+retry+'</div>';
  } else {
    bbar.innerHTML = '';
  }

  const status = state.login === 'ok'
    ? (state.logged_in ? '已登录' : '未登录')
    : (loginLabel[state.login] || state.login || '—');
  const statusCls = state.login === 'ok' ? 'ok' : (state.login === 'expired' || state.login === 'error') ? 'err' : (state.login === 'verify' ? 'warn' : '');
  const cards = [
    {ic:'◷', cls:'amber', label:'当前公网 IP', value:state.ip || '—', sub:state.ip_source || ''},
    {ic:'✓', cls:'green', label:'更新状态', value:last.ok === true ? '成功' : last.ok === false ? '失败' : '—', sub:ago(last.at)},
    {ic:'⏱', cls:'violet', label:'上次检测', value:ago(state.last_check), sub:''},
    {ic:'👤', cls:'blue', label:'企微后台', value:status, sub:''},
  ];
  document.getElementById('stats').innerHTML = cards.map(c =>
    '<div class="stat"><div class="ico '+c.cls+'">'+c.ic+'</div><div style="min-width:0">'+
    '<div class="label">'+esc(c.label)+'</div><div class="value">'+esc(c.value)+'</div>'+
    (c.sub?'<div class="label">'+esc(c.sub)+'</div>':'')+'</div></div>').join('');

  const tag = document.getElementById('loginTag');
  tag.textContent = status; tag.className = 'badge ' + statusCls;

  const body = document.getElementById('loginBody');
  if(state.login === 'verify'){
    // 保留用户正在输入的内容（页面 4s 轮询一次，别把输入框冲掉）
    const old = document.getElementById('verifyCode');
    const typed = old ? old.value : '';
    body.innerHTML = '<div class="verify-box">'+
      (state.verify ? '<img class="vimg" src="'+esc(state.verify)+'" alt="验证码图片">' : '')+
      '<div class="vform">'+
        '<div class="vmsg">⚠ '+esc(state.verify_msg || '企微要求安全验证，请输入验证码')+'</div>'+
        '<div class="vrow"><input id="verifyCode" type="text" inputmode="text" autocomplete="one-time-code" '+
          'placeholder="输入短信 / 图形验证码" value="'+esc(typed)+'">'+
        '<button class="btn primary" onclick="submitVerify()">提交</button></div>'+
        '<div class="hint">如果是短信验证码，先确认已收到短信；图形验证码请照左侧图片输入。提交后等待登录完成。</div>'+
      '</div></div>';
  } else if(state.qr && (state.login === 'qr' || state.login === 'waiting')){
    body.innerHTML = '<div class="qr-box"><img src="'+esc(state.qr)+'" alt="登录二维码">'+
      '<div class="tip">用<strong>企业微信 App</strong> 扫码 → 手机上点<strong>确认登录</strong>。<br>'+
      '二维码 '+fmtTime(state.qr_at)+' 生成，最多等 5 分钟。<br>'+
      '页面会自动刷新状态，登录成功后二维码消失。</div></div>';
  } else {
    body.innerHTML = '<p style="color:var(--text-2);font-size:12.5px">'+
      (state.logged_in ? '后台登录态已保存。失效时会在下一轮检测里提示重新扫码。'
                       : '还没登录企微管理后台。点上方「扫码登录」，用企业微信 App 扫码即可。')+'</p>'+
      (state.last_error ? '<p style="color:var(--err);font-size:12.5px;margin-top:8px">最近错误：'+esc(state.last_error)+'</p>':'');
  }
  const shot = document.getElementById('shotImg');
  if(state.shot){ shot.src = state.shot; shot.style.display = 'block'; }

  const hist = document.getElementById('history');
  const list = state.history || [];
  hist.innerHTML = list.length ? list.slice().reverse().map(h =>
    '<div class="ev"><span class="badge '+(h.ok?'ok':'err')+'">'+(h.ok?'成功':'失败')+'</span>'+
    '<span class="txt">'+esc(h.old||'—')+' → '+esc(h.ip||'—')+' · '+esc(h.detail||'')+'</span>'+
    '<span class="tm">'+fmtTime(h.at)+'</span></div>').join('') : '<div class="empty">还没有更新记录</div>';

  if(!formTouched){
    document.getElementById('f_enabled').checked = !!s.enabled;
    document.getElementById('f_auto').checked = !!s.auto;
    document.getElementById('f_notify').checked = !!s.notify;
    document.getElementById('f_interval').value = s.interval || 300;
    document.getElementById('f_agents').value = s.agent_ids || '';
    document.getElementById('f_proxy').value = s.proxy || '';
  }
}

async function load(){
  try{
    state = await req('/state'); render();
  }catch(e){ toast('读取状态失败：'+e.message, true); }
}
async function act(name){
  if(busy) return;
  busy = true;
  const tip = name === 'login' ? '正在准备二维码…'
            : name === 'browser' ? '已开始下载浏览器，请稍候…'
            : '已提交，稍后刷新看结果';
  toast(tip);
  try{ await req('/'+name, {method:'POST', body:'{}'}); await load(); }
  catch(e){ toast(e.message, true); }
  finally{ busy = false; }
}
async function submitVerify(){
  const el = document.getElementById('verifyCode');
  const code = el ? el.value.trim() : '';
  if(!code){ toast('请先输入验证码', true); return; }
  if(busy) return;
  busy = true;
  try{
    await req('/verify', {method:'POST', body:JSON.stringify({code:code})});
    toast('验证码已提交，等待登录结果…');
    await load();
  }catch(e){ toast(e.message, true); }
  finally{ busy = false; }
}
document.addEventListener('keydown', e=>{
  if(e.key === 'Enter' && e.target && e.target.id === 'verifyCode'){ e.preventDefault(); submitVerify(); }
});
async function save(){
  const patch = {
    enabled: document.getElementById('f_enabled').checked,
    auto: document.getElementById('f_auto').checked,
    notify: document.getElementById('f_notify').checked,
    interval: document.getElementById('f_interval').value,
    agent_ids: document.getElementById('f_agents').value,
    proxy: document.getElementById('f_proxy').value,
  };
  try{
    await req('/settings', {method:'POST', body:JSON.stringify(patch)});
    formTouched = false; await load(); toast('设置已保存');
  }catch(e){ toast('保存失败：'+e.message, true); }
}
document.querySelectorAll('input').forEach(el => el.addEventListener('input', ()=>{ formTouched = true; }));

load();
setInterval(()=>{ if(!formTouched) load(); }, 4000);
</script>
</body>
</html>

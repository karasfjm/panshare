<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PanShare · 115 网盘 STRM</title>
<link rel="stylesheet" href="/static/styles.css?v={{VERSION}}">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%233b6ef6'/%3E%3Cstop offset='.55' stop-color='%236366f1'/%3E%3Cstop offset='1' stop-color='%2322d3ee'/%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Cpath d='M9 22V10l9 12V10' stroke='white' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
</head>
<body>

<!-- ============================== 登录 ============================== -->
<section class="login" id="loginView" hidden>
  <div class="login-bg" id="loginBg"></div>
  <div class="login-photo" id="loginPhoto"></div>
  <div class="login-veil"></div>

  <form class="login-card" id="loginForm" autocomplete="off">
    <div class="login-brand">
      <span class="brand-mark">P</span>
      <span class="login-brand-name"><b>Pan</b>Share</span>
    </div>

    <label class="field">
      <span class="field-label">账号</span>
      <input id="loginUser" class="input" placeholder="请输入账号" autocomplete="username">
    </label>

    <label class="field">
      <span class="field-label">密码</span>
      <span class="pw-wrap">
        <input id="loginPass" class="input" type="password" placeholder="请输入密码" autocomplete="current-password">
        <button type="button" class="pw-eye" id="togglePw" aria-label="显示密码"></button>
      </span>
    </label>

    <button class="btn btn-primary login-btn" type="submit">登录</button>
    <p class="login-hint" id="loginHint"></p>
    <p class="login-error" id="loginError"></p>
  </form>

  <div class="login-foot">PanShare · 115 网盘 STRM · 账号密码由 docker-compose 变量生成</div>
</section>

<!-- ============================== 主界面 ============================== -->
<div class="app" id="appView" hidden>
  <aside class="sidebar">
    <div class="side-brand">
      <span class="brand-mark sm">P</span>
      <span class="side-brand-name"><b>Pan</b>Share</span>
    </div>

    <nav class="nav" id="sideNav"></nav>

    <div class="side-foot">
      <span class="ver-pill"><i class="ver-dot"></i><span id="verText">—</span></span>
    </div>
  </aside>

  <!-- 菜单按钮放在 topbar 外面：topbar 是 sticky（会创建层叠上下文），
       按钮在里面就永远压不过侧栏，侧栏展开后点不到它（关不掉侧栏）。 -->
  <button class="icon-btn nav-toggle" id="navToggle" aria-label="菜单"></button>

  <main class="main">
    <header class="topbar">
      <div class="crumb" id="crumb"></div>
      <div class="orbs">
        <button class="orb" data-panel="logs" title="运行日志" aria-label="运行日志"></button>
        <button class="orb" data-panel="theme" title="主题" aria-label="主题"></button>
        <button class="orb" data-panel="more" title="更多操作"></button>
      </div>
    </header>

    <div class="view" id="view"></div>
  </main>
</div>

<!-- ============================== 浮层 ============================== -->
<div class="scrim" id="scrim" hidden></div>

<aside class="drawer" id="logsDrawer" hidden>
  <div class="drawer-head">
    <div>
      <h3>运行日志</h3>
      <p class="muted" id="logCount">—</p>
    </div>
    <div class="drawer-tools">
      <button class="icon-btn" id="logRefresh" title="刷新"></button>
      <button class="icon-btn danger" id="logClear" title="清空"></button>
      <button class="icon-btn" data-close-drawer title="关闭"></button>
    </div>
  </div>
  <div class="drawer-filter" id="logFilter"></div>
  <div class="log-list" id="logList"></div>
</aside>

<div class="popover" id="themePop" hidden>
  <div class="pop-head">主题</div>
  <div class="theme-list" id="themeList"></div>
</div>

<div class="popover" id="morePop" hidden>
  <button class="pop-item" data-more="status">
    <span class="pop-ico"></span><span>运行状态</span>
  </button>
  <button class="pop-item" data-more="scan">
    <span class="pop-ico"></span><span>立即全量扫描</span>
  </button>
  <button class="pop-item" data-more="poll">
    <span class="pop-ico"></span><span>立即增量同步</span>
  </button>
  <div class="pop-sep"></div>
  <button class="pop-item danger" data-more="logout">
    <span class="pop-ico"></span><span>退出登录</span>
  </button>
</div>

<div class="modal-wrap" id="modalWrap" hidden>
  <div class="modal" id="modalBox"></div>
</div>

<div class="toasts" id="toasts"></div>

<script src="/static/js/core.js?v={{VERSION}}"></script>
<script src="/static/js/api.js?v={{VERSION}}"></script>
<script src="/static/js/data.js?v={{VERSION}}"></script>
<script src="/static/js/shell.js?v={{VERSION}}"></script>
<script src="/static/js/views.js?v={{VERSION}}"></script>
<script src="/static/js/tool-115.js?v={{VERSION}}"></script>
<script src="/static/js/tool-share.js?v={{VERSION}}"></script>
<script src="/static/js/tool-ed2k.js?v={{VERSION}}"></script>
<script src="/static/js/tool-instant.js?v={{VERSION}}"></script>
<script src="/static/js/tool-strm115.js?v={{VERSION}}"></script>
<script src="/static/js/tool-plugins.js?v={{VERSION}}"></script>
<script src="/static/js/main.js?v={{VERSION}}"></script>
</body>
</html>

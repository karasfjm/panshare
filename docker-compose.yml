services:
  panshare:
    #build:
      #context: .
      #args:
        #VERSION: "1.0.0"
        # 拉不动依赖时改这两个（海外机器换成官方源）
        #GOPROXY: https://goproxy.cn,direct
        #NPM_REGISTRY: https://registry.npmmirror.com
    image: panshare:latest
    container_name: panshare
    restart: unless-stopped
    network_mode: bridge
    environment:
      TZ: Asia/Shanghai
      PS_DATA_DIR: /config
      PS_STRM_ROOT: /strm
      # 写进 strm 的请求头：必须是播放器（电视 / 手机 / Emby）能访问到的地址
      PS_PUBLIC_BASE_URL: http://172.17.0.1:9527
      # 控制台登录：由 compose 决定，改这里即可（也支持 .env 覆盖）
      PS_USERNAME: ${PS_USERNAME:-admin}
      PS_PASSWORD: ${PS_PASSWORD:-password}
      # Telegram 与 TMDB 登录背景共用的代理；留空则跟随 HTTPS_PROXY
      PS_PROXY: ${PS_PROXY:-}
      # TMDB API Key（可选）：填了走 TMDB 官方接口；留空则从 TMDB 热门页随机取横幅
      PS_TMDB_API_KEY: ${PS_TMDB_API_KEY:-}
      # 115 接口节流：太高会被 WAF 拦成 405
      PS_API_TIMEOUT: "30"
      # Emby 反代端口（整站反代到第一台启用的 Emby，播放走 302 直连 115）；
      # 设成 0 表示关闭反代
      PS_EMBY_PROXY_PORT: "7259"
      PS_VERSION: "1.0.0"
    ports:
      - "9527:9527"
      - "7259:7259"
    volumes:
      - ./config:/config
      - ./strm:/strm
